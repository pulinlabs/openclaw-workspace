[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-workspace"
version = "0.1.0"
description = "Public-safe OpenClaw workspace runtime sample."
requires-python = ">=3.11"

[project.scripts]
openclaw-workspace = "openclaw_workspace.cli:main"

[tool.setuptools]
packages = ["openclaw_workspace"]
